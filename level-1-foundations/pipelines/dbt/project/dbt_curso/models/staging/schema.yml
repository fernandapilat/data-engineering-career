# Configuration block for dbt models
models:
  # Name of the staging model for customer data
  - name: stg_clientes
    # List of column-level test definitions and documentation
    columns:
      # Target column: customer unique identifier
      - name: id_cliente
        # Data quality tests applied to this column
        tests:
          # Ensures no records have null/missing values in this column
          - not_null
          # Ensures all values in this column are completely distinct (primary key behavior)
          - unique

  # Name of the staging model for orders data
  - name: stg_pedidos
    # List of column-level test definitions and documentation
    columns:
      # Foreign key column referencing the customer unique identifier
      - name: id_cliente
        tests:
          # Referential integrity test ensuring every id_cliente exists in stg_clientes
          - relationships:
              arguments:
                # Target parent table/model being referenced
                to: ref('stg_clientes')
                # Primary key field in the referenced table
                field: id_cliente