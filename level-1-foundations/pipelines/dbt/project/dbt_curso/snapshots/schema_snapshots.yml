version: 2

snapshots:

# ==========================================
# SNAPSHOT - CUSTOMER HISTORY (SCD TYPE 2)
# ==========================================

  # Snapshot model to track historical changes in customer data over time
  - name: snap_clientes
    description: "Snapshot tracking historical changes in customer data over time (SCD Type 2)."

    columns:
      # Natural primary key from the source table
      - name: id_cliente
        description: "Unique identifier for the customer."
        tests:
          - not_null

      # Tracked descriptive attributes
      - name: nome_completo
        description: "Full name of the customer."

      - name: cidade
        description: "City of the customer."

      - name: estado
        description: "State/Province of the customer."

      # ==========================================
      # DBT SYSTEM-GENERATED FIELDS (SCD TYPE 2)
      # ==========================================

      # Timestamp marking when the record version became active
      - name: dbt_valid_from
        description: "Start timestamp indicating when this version of the record became valid."

      # Timestamp marking when the record version was superseded (null for current active version)
      - name: dbt_valid_to
        description: "End timestamp indicating when this version expired (null for the current active record)."

      # Unique surrogate key generated by dbt for each historical version
      - name: dbt_scd_id
        description: "Unique surrogate key identifying this specific record version."

      # Timestamp of the latest update detected by the snapshot process
      - name: dbt_updated_at
        description: "Timestamp of the last update detected during snapshot execution."